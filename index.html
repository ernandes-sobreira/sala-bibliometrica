<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala Bibliométrica</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fa;color:#1a2332}.boot{min-height:100vh;display:grid;place-items:center}.box{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:28px 32px;max-width:620px;box-shadow:0 12px 36px rgba(26,35,50,.08)}.spin{display:inline-block;width:18px;height:18px;border:2px solid #cfd8e2;border-top-color:#56B4E9;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:10px}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b23a3a;line-height:1.5}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="box"><span class="spin"></span>Carregando a Sala Bibliométrica…</div></div>
<script>
(async()=>{
  const STABLE='38fd420d56725859ed72e506a95bba4c638756ba';
  const sources=[
    `https://raw.githubusercontent.com/ernandes-sobreira/sala-bibliometrica/${STABLE}/index.html`,
    `https://cdn.jsdelivr.net/gh/ernandes-sobreira/sala-bibliometrica@${STABLE}/index.html`
  ];
  const fetchText=async(url,ms=6500)=>{
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
    try{const r=await fetch(url,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
    finally{clearTimeout(timer);}
  };
  let src='',last='';
  for(const url of sources){
    try{src=await fetchText(url);if(src.includes("const BASE_COMMIT='4e2965fd8f8269f81bb25c0cd4e6d45729fc788d'"))break;src='';}
    catch(e){last=e.name==='AbortError'?'tempo esgotado':String(e.message||e);src='';}
  }
  if(!src){document.getElementById('boot').innerHTML='<div class="box err"><b>Não foi possível carregar a aplicação.</b><br>'+last+'</div>';return;}

  const needle='document.open();document.write(html);document.close();';
  const replacement=`try{\n    const editorPatch=await fetchText('./editor-patch.js?v=20261001g',5000);\n    const repairPatch=await fetchText('./editor-fix.js?v=20261001a',5000);\n    const marker='/* ---------- importação e parser ---------- */';\n    if(editorPatch&&repairPatch&&html.includes(marker)){\n      new Function(editorPatch); new Function(repairPatch);\n      html=html.replace(marker,editorPatch+'\\n'+repairPatch+'\\n'+marker);\n    }\n  }catch(e){console.warn('Editor/reparo não carregado:',e);}\n  document.open();document.write(html);document.close();`;
  if(!src.includes(needle)){document.getElementById('boot').innerHTML='<div class="box err"><b>Não foi possível acoplar o editor.</b><br>A versão-base mudou; nenhum dado foi alterado.</div>';return;}
  src=src.replace(needle,replacement);
  document.open();document.write(src);document.close();
})().catch(e=>{document.getElementById('boot').innerHTML='<div class="box err"><b>Erro ao iniciar a Sala.</b><br>'+String(e.message||e)+'</div>';});
</script>
</body>
</html>
