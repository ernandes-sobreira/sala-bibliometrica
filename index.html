<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala Bibliométrica</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fa;color:#1a2332}.boot{min-height:100vh;display:grid;place-items:center}.box{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:28px 32px;max-width:560px;box-shadow:0 12px 36px rgba(26,35,50,.08)}.spin{display:inline-block;width:18px;height:18px;border:2px solid #cfd8e2;border-top-color:#56B4E9;border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:10px}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b23a3a;line-height:1.5}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="box"><span class="spin"></span>Carregando a Sala Bibliométrica…</div></div>
<script>
(async()=>{
  const BASE_COMMIT='4e2965fd8f8269f81bb25c0cd4e6d45729fc788d';
  const sources=[
    `https://raw.githubusercontent.com/ernandes-sobreira/sala-bibliometrica/${BASE_COMMIT}/index.html`,
    `https://cdn.jsdelivr.net/gh/ernandes-sobreira/sala-bibliometrica@${BASE_COMMIT}/index.html`
  ];
  let html='', lastErr='';
  for(const url of sources){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      html=await r.text();
      if(html.includes('function buildCorpus(rows)')) break;
      html='';
    }catch(e){lastErr=e.message;}
  }
  if(!html){
    document.getElementById('boot').innerHTML=`<div class="box err"><b>Não foi possível carregar a aplicação.</b><br>${lastErr||'Falha ao carregar o código-base.'}<br><br>Atualize a página em alguns instantes.</div>`;
    return;
  }

  // 1) Reconhece o CSV padrão exportado pela SciELO e separa corretamente os autores.
  html=html.replace(
    "function splitSep(str, sep){ if(!str) return []; return String(str).split(sep).map(s => s.trim()).filter(Boolean); }",
    `function splitSep(str, sep){ if(!str) return []; return String(str).split(sep).map(s => s.trim()).filter(Boolean); }\nfunction splitSciELOAuthors(str){\n  if(!str) return [];\n  const p=String(str).split(',').map(s=>s.trim()).filter(Boolean), out=[];\n  for(let i=0;i<p.length;i+=2){ out.push(p[i+1] ? p[i]+', '+p[i+1] : p[i]); }\n  return [...new Set(out.map(a=>a.replace(/\\s+/g,' ').trim()).filter(Boolean))];\n}`
  );

  html=html.replace(
    "  const isPubMed = cols.includes('PMID') && cols.includes('Journal/Book');\n  const format = isWoSFull ? 'Web of Science' : isWoSShort ? 'Web of Science (campos curtos)' : isScopus ? 'Scopus' : isPubMed ? 'PubMed' : 'formato genérico';",
    "  const isPubMed = cols.includes('PMID') && cols.includes('Journal/Book');\n  const isSciELO = cols.includes('Title') && cols.includes('Author(s)') && cols.includes('Publication year') && (cols.includes('Journal') || cols.includes('Source'));\n  const format = isWoSFull ? 'Web of Science' : isWoSShort ? 'Web of Science (campos curtos)' : isScopus ? 'Scopus' : isPubMed ? 'PubMed' : isSciELO ? 'SciELO' : 'formato genérico';"
  );

  html=html.replace(
    "    else if(isPubMed) o = {authors: splitSep(r['Authors'], ','), title: r['Title'], journal: r['Journal/Book'], year: r['Publication Year'], keywords: [], kwplus: [], area: [], affil: '', addresses: '', citations: '', doi: r['DOI'], doctype: '', lang: ''};\n    else o = {authors: splitSep(g(r,'AU','Authors','Author'), ';'), title: g(r,'TI','Article Title','Title'), journal: g(r,'SO','Source Title','Source title','Journal'), year: g(r,'PY','Publication Year','Year'), keywords: splitSep(g(r,'DE','Author Keywords','Keywords'), ';'), kwplus: splitSep(g(r,'ID','Keywords Plus'), ';'), area: splitSep(g(r,'WC','WoS Categories','Research Areas','Subject'), ';'), affil: g(r,'C1','Affiliations','Addresses'), addresses: g(r,'C1','Addresses','Affiliations'), citations: g(r,'TC','Times Cited, WoS Core','Cited by'), doi: g(r,'DI','DOI'), doctype: g(r,'DT','Document Type'), lang: g(r,'LA','Language')};",
    "    else if(isPubMed) o = {authors: splitSep(r['Authors'], ','), title: r['Title'], journal: r['Journal/Book'], year: r['Publication Year'], keywords: [], kwplus: [], area: [], affil: '', addresses: '', citations: '', doi: r['DOI'], doctype: '', lang: ''};\n    else if(isSciELO) o = {authors: splitSciELOAuthors(r['Author(s)']), title: r['Title'], journal: r['Journal'] || r['Source'], year: r['Publication year'], keywords: splitSep(g(r,'Keywords','Palavras-chave','Palavras chave'), /;|\\|/), kwplus: [], area: [], affil: '', addresses: '', citations: 0, doi: g(r,'DOI'), doctype: '', lang: r['Language(s)'] || ''};\n    else o = {authors: splitSep(g(r,'AU','Authors','Author'), ';'), title: g(r,'TI','Article Title','Title'), journal: g(r,'SO','Source Title','Source title','Journal'), year: g(r,'PY','Publication Year','Year'), keywords: splitSep(g(r,'DE','Author Keywords','Keywords'), ';'), kwplus: splitSep(g(r,'ID','Keywords Plus'), ';'), area: splitSep(g(r,'WC','WoS Categories','Research Areas','Subject'), ';'), affil: g(r,'C1','Affiliations','Addresses'), addresses: g(r,'C1','Addresses','Affiliations'), citations: g(r,'TC','Times Cited, WoS Core','Cited by'), doi: g(r,'DI','DOI'), doctype: g(r,'DT','Document Type'), lang: g(r,'LA','Language')};"
  );

  // 2) Não bloqueia a análise esperando o Firebase Storage. O arquivo é tentado em segundo plano com timeout.
  const newHandle=`async function handleFile(file){\n  if(!PROJ){ setMsg('data-msg', 'Abra ou crie um projeto antes de importar.', 'warn'); return; }\n  setMsg('data-msg', '<span class="spinner"></span>Lendo o arquivo', 'info');\n  let rows;\n  try{ rows = await readRows(file); }\n  catch(e){ console.error(e); setMsg('data-msg', 'Não foi possível ler o arquivo: ' + esc(e.message), 'err'); return; }\n  if(!rows.length){ setMsg('data-msg', 'O arquivo não tem linhas de dados.', 'err'); return; }\n  const corpus = buildCorpus(rows);\n  if(!corpus.records.length){ setMsg('data-msg', 'Nenhum registro reconhecido. Colunas encontradas: ' + esc(Object.keys(rows[0]).slice(0, 12).join(', ')), 'err'); return; }\n  CORPUS = corpus; RAW_FILE = file;\n\n  // Libera imediatamente as análises: o upload do arquivo bruto não pode travar a sala.\n  setMsg('data-msg', fmt(corpus.records.length) + ' registros lidos (' + esc(corpus.format) + '). Calculando análises…', 'info');\n  renderProjectLine(); renderCorpusUI();\n  computeAll(); renderAll();\n  saveResults().catch(e=>console.warn('Falha ao salvar resultados:',e));\n  showTab('analises');\n\n  const timeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);\n  try{\n    const path = 'users/' + USER.uid + '/projects/' + PROJ.id + '/' + file.name;\n    if(PROJ.file?.path && PROJ.file.path !== path){\n      await Promise.race([storage.ref(PROJ.file.path).delete().catch(()=>{}),new Promise(r=>setTimeout(r,3000))]);\n    }\n    setMsg('data-msg', fmt(corpus.records.length) + ' registros lidos (' + esc(corpus.format) + '). Salvando o arquivo no projeto…', 'info');\n    await timeout(storage.ref(path).put(file,{contentType:file.type||'application/octet-stream'}),12000,'o Storage demorou mais de 12 segundos');\n    await timeout(updateProj({file:{name:file.name,path,size:file.size,records:corpus.records.length,format:corpus.format,uploadedAt:new Date().toISOString()}}),8000,'não foi possível confirmar o arquivo no projeto');\n    setMsg('data-msg', 'Arquivo guardado no projeto: ' + esc(file.name) + '.', 'ok');\n    renderProjectLine(); renderCorpusUI();\n  }catch(e){\n    console.error(e);\n    setMsg('data-msg', fmt(corpus.records.length) + ' registros lidos (' + esc(corpus.format) + '). As análises estão disponíveis. O arquivo bruto não foi guardado no Storage: ' + esc(e.message) + '.', 'warn');\n  }\n}`;
  html=html.replace(/async function handleFile\(file\)\{[\s\S]*?\n\}\nfunction readRows\(file\)\{/,newHandle+'\nfunction readRows(file){');

  // Segurança: se alguma substituição essencial falhar, não entrega uma versão silenciosamente quebrada.
  if(!html.includes("const isSciELO =") || !html.includes("splitSciELOAuthors") || !html.includes("o Storage demorou mais de 12 segundos")){
    document.getElementById('boot').innerHTML='<div class="box err"><b>Atualização incompleta.</b><br>O código-base mudou e o patch SciELO não pôde ser aplicado com segurança.</div>';
    return;
  }

  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  document.getElementById('boot').innerHTML='<div class="box err"><b>Erro ao iniciar a Sala.</b><br>'+String(e.message||e)+'</div>';
});
</script>
</body>
</html>
